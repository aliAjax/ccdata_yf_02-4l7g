<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Canvas Room · 协作白板工作台</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="app">
  <header class="top">
    <div class="logo"><div class="dot">C</div>Canvas Room</div>
    <div class="room">
      <label for="roomInput">房间</label>
      <input id="roomInput" spellcheck="false" autocomplete="off">
      <button id="switchRoom" title="切换或新建房间">进入</button>
      <button id="copy" title="复制本房间链接">复制链接</button>
    </div>
    <div class="actions">
      <button id="undo" title="撤销 (Ctrl+Z)">↶ 撤销</button>
      <button id="redo" title="重做 (Ctrl+Y / Ctrl+Shift+Z)">↷ 重做</button>
      <button id="clear">清空房间</button>
      <button id="exportBtn" class="primary">导出房间</button>
      <button id="importBtn" class="primary">导入房间</button>
      <input type="file" id="importFile" accept="application/json,.json" hidden>
    </div>
  </header>

  <section class="layout">
    <aside class="panel left">
      <h3>工具</h3>
      <div class="tools">
        <button class="tool active" data-type="note">▤ 便签</button>
        <button class="tool" data-type="text">T 文本</button>
        <button class="tool" data-type="rect">□ 矩形</button>
        <button class="tool" data-type="circle">○ 圆形</button>
        <button class="tool" data-type="line">╱ 连线</button>
        <button class="tool" data-type="select">↖ 选择</button>
      </div>
      <div class="divider"></div>
      <h3>便签颜色</h3>
      <div class="color">
        <button class="active" style="background:#fff3bf" data-c="yellow" title="黄色"></button>
        <button style="background:#dff3ff" data-c="blue" title="蓝色"></button>
        <button style="background:#ffe0eb" data-c="pink" title="粉色"></button>
      </div>
      <div class="divider"></div>
      <h3>快捷操作</h3>
      <p class="hint">点击画布放置元素<br>拖动元素可移动，连线实时跟随<br>连线工具：依次点击两个元素<br>双击便签/文本编辑内容<br><b>Delete</b> 删除选中（含关联连线）<br><b>Ctrl+Z</b> 撤销 · <b>Ctrl+Y</b> 重做</p>
    </aside>

    <section class="board-wrap">
      <div class="board-head">
        <span class="local-badge" title="所有数据保存在本机浏览器，按房间隔离">● 本地工作台</span>
        <small id="roomStat"></small>
        <small id="sync" class="sync">● 已保存</small>
      </div>
      <div class="board" id="board">
        <svg class="edge-layer" id="edgeLayer" aria-hidden="true">
          <defs>
            <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
              <path d="M0,0 L10,5 L0,10 z" fill="#667484"></path>
            </marker>
            <marker id="arrow-active" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
              <path d="M0,0 L10,5 L0,10 z" fill="#276ef1"></path>
            </marker>
          </defs>
          <g id="edgeLines"></g>
        </svg>
      </div>
    </section>

    <aside class="panel right">
      <h3>本房间动态</h3>
      <div id="activity"><div class="event muted">暂无操作</div></div>
      <div class="divider"></div>
      <h3>筛选便签</h3>
      <div class="filter">
        <button class="active" data-filter="all">全部</button>
        <button data-filter="yellow">黄色</button>
        <button data-filter="blue">蓝色</button>
        <button data-filter="pink">粉色</button>
      </div>
      <div class="divider"></div>
      <h3>房间成员（演示）</h3>
      <div class="member"><div class="avatar" style="background:#276ef1">你</div><div><b>你</b><br><small>主持人 · 本地工作</small></div></div>
      <div class="member"><div class="avatar" style="background:#ed6a5a">林</div><div><b>林晓</b><br><small>设计师</small></div></div>
      <div class="member"><div class="avatar" style="background:#44a57b">M</div><div><b>Morgan</b><br><small>产品</small></div></div>
    </aside>
  </section>
</main>
<div class="toast" id="toast"></div>

<script src="rules.js"></script>
<script src="app.js"></script>
</body>
</html>
